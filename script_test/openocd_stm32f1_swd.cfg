# Minimal STM32F1x SWD target config
# Probe: akaLinkPro (HPM5301EVKLite port), SWD wired on the J5 JTAG socket:
#   J5.9  (PA06) -> SWCLK   J5.7 (PA07) -> SWDIO   J5.3 (PA08) -> nRESET
#
# Usage (sdk_env_v1.11.0 bundled OpenOCD, scripts tree has no target/ dir):
#   openocd.exe -s <openocd>\tcl -f openocd_stm32f1_swd.cfg ^
#       -c "init" -c "targets" -c "reset halt" -c "shutdown"
adapter driver cmsis-dap
transport select swd
adapter speed 1000

set _CHIPNAME stm32f1x
set _CPUTAPID 0x1ba01477
set _TARGETNAME $_CHIPNAME.cpu

swd newdap $_CHIPNAME cpu -irlen 4 -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x1000 -work-area-backup 0

flash bank $_CHIPNAME.flash stm32f1x 0x08000000 0 0 0 $_TARGETNAME
