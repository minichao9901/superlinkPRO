# Minimal STM32H743 (Cortex-M7) SWD target config
# Probe: akaLinkPro (HPM5301EVKLite port), SWD on the J5 socket:
#   J5.9 (PA06) -> SWCLK   J5.7 (PA07) -> SWDIO   J5.3 (PA08) -> nRESET
#
# 注意：work-area 与 RTT 缓冲都放 AXI SRAM(0x24000000) —— H7 的 DTCM(0x20000000)
# 是内核私有总线，外部调试器走 AHB-AP 读不到。
adapter driver cmsis-dap
transport select swd
adapter speed 1000

set _CHIPNAME stm32h7x
set _CPUTAPID 0x6ba02477
set _TARGETNAME $_CHIPNAME.cpu

swd newdap $_CHIPNAME cpu -irlen 4 -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap
# work-area 放 **D2 SRAM(0x30000000)**：AXI SRAM(0x24000000) 是目标跑代码的地方，
# 之前把 flash 算法加载到 0x24000000 正好压在运行中的代码上 ⇒ 算法跑飞、
# "timed out while waiting for target halted"。D2 SRAM 同样能经 AHB-AP 访问。
$_TARGETNAME configure -work-area-phys 0x30000000 -work-area-size 0x10000 -work-area-backup 0

flash bank $_CHIPNAME.flash stm32h7x 0x08000000 0 0 0 $_TARGETNAME
