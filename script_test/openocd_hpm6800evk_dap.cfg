# HPM6800EVK (HPM6880, RISC-V) debugged through the akaLinkPro CMSIS-DAP probe.
#
# RISC-V only has JTAG (no SWD), and the probe's JTAG TDI/TDO share pins with
# the VCOM UART on the akaLinkPro board, so the probe must be switched to
# output_mode = 1 (SWD+JTAG) first:  python script_test/hpm6800_probe.py set-mode 1
#
# Usage (HPM_SDK_BASE / the board-openocd dir must be on the script search path
# because soc/hpm_common.cfg is pulled in with [find ...]):
#   openocd -s <sdk>/tools/openocd/tcl -s <sdk>/hpm_sdk/boards/openocd \
#           -f script_test/openocd_hpm6800evk_dap.cfg -c "init; halt; shutdown"

proc _hpm6800_dirs {} {
    return [list \
        [file normalize [file join [file dirname [info script]] .. .. sdk_env_v1.11.0 hpm_sdk boards openocd]]]
}

if { ![info exists HPM_SDK_BASE] } {
    if { [info exists ::env(HPM_SDK_BASE)] } {
        set HPM_SDK_BASE $::env(HPM_SDK_BASE)
    } else {
        set HPM_SDK_BASE "E:/sdk_env_v1.11.0/hpm_sdk"
    }
}

source [find interface/cmsis-dap.cfg]
transport select jtag

# The akaLinkPro JTAG engine runs off a fixed-timing ASM blob; the requested
# speed is forwarded to DAP_SWJ_Clock for the C fallback path.
adapter speed 8000
adapter srst delay 500
# Do NOT use the SRST pin: on the HPM5301EVKLite the 20-pin ribbon carries the
# probe's *own* RESET_N on pin 15, so asserting nSRST would reset the probe too
# (observed as OpenOCD hanging and the probe dropping off USB). With `none` the
# riscv target resets through the Debug Module (dmcontrol.ndmreset) instead.
reset_config none

source ${HPM_SDK_BASE}/boards/openocd/soc/hpm6880.cfg
source ${HPM_SDK_BASE}/boards/openocd/boards/hpm6800evk.cfg
